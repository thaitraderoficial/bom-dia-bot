name: Bom Dia Bot

on:
  schedule:
    # 10:00 UTC = 07:00 no horário de Brasília (UTC-3, sem horário de verão)
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {} # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write  # necessário para o robô salvar a memória da última manchete

jobs:
  enviar-resumo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar o bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bom_dia_bot.py

      - name: Salvar memória da última manchete
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ultima_manchete.json
          git diff --cached --quiet || git commit -m "Atualiza última manchete enviada"
          git push || echo "Nada novo para salvar (ou push falhou) - seguindo normalmente"
